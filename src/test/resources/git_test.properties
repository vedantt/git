# Git Test Configuration

# For the testCloneAndAddNewFile test
# Define the name of the new file to be created
git.new.filename=autogenerated_file.txt
# Define the content for the new file
git.new.filecontent=This content is read from a properties file.\nTimestamp: {TIMESTAMP}

# For the testCloneAndUpdateExistingFile test
# Define the name of the file to be updated (or created if not exists)
git.update.filename=README_updated.md
# Define the initial content if the update file needs to be created
git.update.initialcontent=Initial content for the updatable file.\nThis will be overwritten or appended to.
# Define the content to append to the existing file
git.update.appendcontent=This is new appended content from properties.\nAnother line for testing.\nTimestamp: {TIMESTAMP}

# Optional: Default commit messages (can be overridden or appended to in tests)
git.commit.message.newfile=Automated: Add new file from properties
git.commit.message.updatefile=Automated: Update file from properties
